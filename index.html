    <!-- Structured Data: FAQ (homepage FAQ section) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What fees can apply?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Fees and exchange rates can vary by feature, payment rail, provider, currency, and eligibility. Where a transaction flow is enabled, applicable pricing should be shown before final confirmation."
          }
        },
        {
          "@type": "Question",
          "name": "How fast are transactions?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Timing depends on the transaction type, payment rail, provider, compliance review, and destination. CardXC includes transaction-status tracking for supported workflows."
          }
        },
        {
          "@type": "Question",
          "name": "What security controls does CardXC use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The platform includes controls such as multi-factor authentication, rate limiting, verified provider webhooks, fraud-oriented checks, and production error monitoring. No online service can eliminate every risk."
          }
        },
        {
          "@type": "Question",
          "name": "Where are CardXC features available?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Feature availability varies by geography, user eligibility, compliance requirements, provider configuration, and external approval. CardXC does not publish a fixed worldwide coverage number without current supporting evidence."
          }
        },
        {
          "@type": "Question",
          "name": "How do I get started?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Create an account and complete the verification steps required for the features you want to use. Identity, provider, or compliance checks can be required before financial functionality becomes available."
          }
        }
      ]
    }
    </script>
